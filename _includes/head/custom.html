{% include base_path %}

<!-- start custom head snippets -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/site/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/site/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/site/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/site/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/site/manifest.json"/>
<link rel="icon" href="/images/site/favicon.ico"/>
<meta name="theme-color" content="#f7f9f6"/>
<link rel="stylesheet" href="{{ '/assets/css/academicons.css' | relative_url }}"/>

{% if page.layout == "profile" %}
<script>
  (() => {
    const saved = localStorage.getItem('profile-theme');
    const theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.dataset.theme = theme;
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
<link rel="preload" href="{{ '/assets/webfonts/fa-solid-900.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ '/assets/css/profile.css' | relative_url }}">
{% else %}
<!-- MathJax for legacy article layouts -->
<script src="https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
{% endif %}
<!-- end custom head snippets -->
